# knowme-dsh-bridge bundle patch: insert the bridge as the SDK stdio entry
# of a profile composed over dsh-base.
#
# dsh-base already mounts everything the bridge methods read (approval,
# user-questions, credentials-local, llm-pi-ai dormant until a settings.yaml
# route activates it) — so this layer adds exactly one row. Insert appends to
# the composed tree, which places the bridge AFTER those services, satisfying
# the bridge's apply-time soft-probe ordering. The bridge is the sole stdio
# transport owner; dsh-base mounts no other stdio SDK server, so there is
# nothing to disable.
- insert:
    - id: knowme-bridge
      name: 'knowme-dsh-bridge'
    # Compose the session-stats projection (turns/steps/timing/first-token/throughput) so
    # knowme/sessionStats can read values.sessionStats — dsh-base already provides the
    # sessionProjections registry (its only inject), so this row is sufficient. Mirrors dsh's
    # own web-app bundle, which is the only shipped bundle that composes session-stats.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'
    # Compose the agentPresets service (dsh 0.2 renamed dsh-agent-presets → dsh-agent-preset-registry;
    # the service still registers as 'agentPresets'). The registry's `default` MUST name a preset that
    # is actually DEFINED by a sibling dsh-agent-preset row, or resolving it (every session/prompt)
    # throws `Unknown agent preset: standard`. dsh-base ships NO preset definitions (only dsh-web-app
    # does, via its presets/ sub-patch), so this bundle must define its own `standard`. A bare preset
    # (plugins: []) adds no tools/persona of its own — the base agent tree stands — but gives the
    # registry a resolvable default so session/prompt + knowme/agentPreset.get work.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard
    # `name` is the user-facing label KnowMe's mode chip / new-session dialog renders verbatim (it reads
    # options[].name from knowme/agentPreset.get), so it carries the Chinese labels the KnowMe UI expects.
    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        name: 标准模式
        description: 默认模式（在基础 agent 树之上不加额外插件）。
        plugins: []
    # KnowMe's new-session dialog offers 标准模式 (standard) + 极简模式 (minimal) — both must be
    # DEFINED here or selecting 极简模式 resolves to null (knowme/agentPreset.set/get fails). minimal is
    # also a bare preset over the base tree; the semantic difference is a KnowMe-side label, not extra rows.
    - id: preset-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minimal
        name: 极简模式
        description: 极简模式（在基础 agent 树之上不加额外插件）。
        plugins: []
