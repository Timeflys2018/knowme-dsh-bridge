# Spike deployment root (dsh 0.2): real dsh runtime, keyless replay LLM, bridge
# as the single SDK entry.
#
# The driver substitutes __SNAPSHOT__/__SESSIONS__/__CWD__ and writes this file
# into a per-tier tmp dir. dsh 0.2 resolves bare plugin names beside the config
# file that declares them, so the plugin tree itself lives in the spike-local
# runtime.cordis.yml (resolving against the spike's node_modules) and this root
# only mounts it, patching in the run-specific config.

- id: spike-runtime
  name: cordis:include
  config:
    # __PRESET_ROOT__ is the driver's only spike-dir directory anchor
    # (<spike>/presets); its parent is the spike dir. Include config is not
    # `!!js`-interpolated, so the path must be a substituted literal.
    path: __PRESET_ROOT__/../runtime.cordis.yml
    patches:
      - id: llm-replay
        config:
          # Paced delivery keeps a turn OPEN long enough for T3b to park an approval
          # mid-turn and shutdown before turn/end — the production shape (a real ask
          # blocks its tool call, so the turn cannot close over a parked ask).
          paceMs: 200
          # dsh 0.2's replay decodes v0 logs strictly (dense seq from 0, exact
          # chunk references). fixtures/two-turn.session.jsonl (0.1-era, kept as
          # recorded) carries non-dense seqs, so the replay reads its projected
          # copy replay/two-turn.session.jsonl: identical rows with seq/time
          # dropped (the replay assigns dense seqs) and each assistant/message
          # sourceEventSeqs recomputed against that numbering.
          file: __PRESET_ROOT__/../replay/two-turn.session.jsonl
          childFiles: [__PRESET_ROOT__/../replay/two-turn.session.jsonl]
          providers:
            - id: deepseek-official
              name: DeepSeek
              models:
                - id: deepseek-v4-flash
                  contextWindow: 128000
                - id: deepseek-v4-pro
                  contextWindow: 128000
      - id: sandbox-policy
        config:
          mode: 'workspace-write'
          workspaceRoot: __CWD__
      - id: sessions
        config:
          root: __SESSIONS__
          compression: none
      - id: fs-local
        config:
          cwd: __CWD__
